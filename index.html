<!DOCTYPE html><html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>John Pye Reverse Calculator</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;margin:0;padding:24px;display:flex;justify-content:center;align-items:center;min-height:100vh}.app{background:#fff;max-width:480px;width:100%;padding:28px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}h1{text-align:center}.subtitle{text-align:center;color:#666}input{width:100%;padding:14px;border-radius:12px;border:1px solid #ccc;font-size:1rem}.toggle{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.result{background:#eef6ff;padding:20px;border-radius:16px;margin-top:20px}.value{font-size:2rem;font-weight:700;color:#2563eb}.warning{color:#dc2626;margin-top:12px;display:none}</style></head><body><main class="app"><h1>John Pye Reverse Calculator</h1><p class="subtitle">Work backwards from your maximum spend to find the highest safe hammer bid.</p><label for="target">Maximum Total Final Price (£)</label><input id="target" type="number" step="0.01" placeholder="e.g. 150.00"><div class="toggle"><span>Does VAT apply to the hammer price?</span><input id="vat" type="checkbox" checked></div><div class="result"><div>Maximum Hammer Bid</div><div class="value" id="result">£0.00</div><div id="verification">Verification: £0.00 + fees = £0.00</div><div class="warning" id="warning">Your target total must be at least £9.59 to cover delivery charges.</div></div></main><script>const DELIVERY=9.588;const target=document.getElementById('target');const vat=document.getElementById('vat');const result=document.getElementById('result');const verification=document.getElementById('verification');const warning=document.getElementById('warning');function money(v){return '£'+v.toFixed(2)}function calc(){const total=parseFloat(target.value);if(isNaN(total)||total<=0){result.textContent='£0.00';verification.textContent='Verification: £0.00 + fees = £0.00';warning.style.display='none';return}if(total<DELIVERY){result.textContent='—';verification.textContent='Verification unavailable';warning.style.display='block';return}warning.style.display='none';const mult=vat.checked?1.5:1.3;const bid=(total-DELIVERY)/mult;const calcTotal=bid*mult+DELIVERY;result.textContent=money(bid);verification.textContent=`Verification: ${money(bid)} + fees = ${money(calcTotal)}`}target.addEventListener('input',calc);vat.addEventListener('change',calc);calc();</script></body></html>
